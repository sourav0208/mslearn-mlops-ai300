name: Train model in dev

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  train-dev:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify Azure connection
        run: |
          az account show \
            --query "{subscription:name,state:state,tenant:tenantId}" \
            --output table

      - name: Install Azure ML CLI
        run: |
          az extension add --name ml --version 2.44.1 --yes
          az version
          az extension show --name ml --query version 

      - name: Verify Azure configuration
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WORKSPACE: ${{ vars.AZURE_WORKSPACE_NAME }}
        run: |
          test -n "$RESOURCE_GROUP" || {
            echo "ERROR: AZURE_RESOURCE_GROUP is empty"
            exit 1
          }

          test -n "$WORKSPACE" || {
            echo "ERROR: AZURE_WORKSPACE_NAME is empty"
            exit 1
          }

          echo "Resource group: $RESOURCE_GROUP"
          echo "Workspace: $WORKSPACE"

          az account show \
            --query "{subscription:name,state:state}" \
            --output table

      - name: Verify workspace through Azure REST API
        shell: bash
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WORKSPACE: ${{ vars.AZURE_WORKSPACE_NAME }}
        run: |
          SUBSCRIPTION=$(az account show --query id -o tsv)

          az rest \
            --method get \
            --url "https://management.azure.com/subscriptions/${SUBSCRIPTION}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.MachineLearningServices/workspaces/${WORKSPACE}?api-version=2024-04-01" \
            --query "{name:name,location:location,state:properties.provisioningState}" \
            --output json
        

      - name: Run training job in dev and capture logs
        id: train
        shell: bash
        run: |
          set -o pipefail
          JOB_NAME="diabetes-train-dev-${{ github.run_id }}"

          az ml job create \
            -f src/job.yml \
            --name "$JOB_NAME" \
            --set inputs.training_data.path=azureml:diabetes-dev-folder:1 \
            --stream | tee training_output.log

      - name: Extract dev metrics from logs
        id: parse-metrics
        run: |
          if [ ! -f training_output.log ]; then
            echo "No training_output.log found to parse metrics." >&2
            exit 1
          fi

          ACC=$(grep -o "Accuracy: .*" training_output.log | tail -n 1 | awk '{print $2}') || true
          AUC=$(grep -o "AUC: .*" training_output.log | tail -n 1 | awk '{print $2}') || true

          echo "Dev accuracy: $ACC"
          echo "Dev AUC: $AUC"

          echo "dev_accuracy=$ACC" >> "$GITHUB_OUTPUT"
          echo "dev_auc=$AUC" >> "$GITHUB_OUTPUT"

      - name: Comment dev metrics on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const acc = '${{ steps.parse-metrics.outputs.dev_accuracy }}';
            const auc = '${{ steps.parse-metrics.outputs.dev_auc }}';

            const prNumber = context.payload.pull_request.number;

            let body = '✅ Dev training workflow completed.';
            if (acc || auc) {
              body += '\n\n**Dev evaluation metrics**';
              if (acc) body += `\n- Accuracy: ${acc}`;
              if (auc) body += `\n- AUC: ${auc}`;
            } else {
              body += '\n\nMetrics could not be parsed from logs. Check the Azure Machine Learning job run for details.';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
